name: Bug report
description: Something in the game or tooling doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Place a Harvester on the quark field
        2. Draw a belt to the Demon
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build version
      description: Shown in Settings, for example 0.5.54
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Unity Editor]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
