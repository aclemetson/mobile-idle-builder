name: Tests

on:
  pull_request:
    branches: [main, develop, "release/*"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PATH: "C:/Program Files/Unity/Hub/Editor/6000.3.6f1/Editor/Unity.exe"

jobs:
  test:
    name: Run Edit-Mode Tests
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Edit-Mode Tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          & $env:UNITY_PATH `
            -runTests `
            -testPlatform editmode `
            -testResults test-results/results.xml `
            -batchmode `
            -projectPath . `
            -logFile test-results/unity.log
          $exitCode = $LASTEXITCODE
          Get-Content test-results/unity.log -ErrorAction SilentlyContinue
          exit $exitCode

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          retention-days: 7
