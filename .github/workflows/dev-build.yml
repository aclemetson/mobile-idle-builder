name: Dev Build

on:
  pull_request:
    types: [closed]
    branches: [develop]

# One build at a time on develop — cancel any queued run if a newer push arrives
concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: write   # needed to commit the version bump back to develop

jobs:
  # ── Job 0: Bump minor version on release→develop merge ───────────────────────
  bump-version:
    name: Bump Minor Version
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest

    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump minor, reset patch
        id: bump
        run: |
          CURRENT=$(grep -oP 'bundleVersion: \K[0-9]+\.[0-9]+\.[0-9]+' ProjectSettings/ProjectSettings.asset)
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW_VER="$major.$((minor + 1)).0"
          echo "Bumping $CURRENT -> $NEW_VER"
          sed -i "s/bundleVersion: $CURRENT/bundleVersion: $NEW_VER/" ProjectSettings/ProjectSettings.asset
          sed -i "s/AndroidBundleVersionCode: [0-9]\+/AndroidBundleVersionCode: 1/" ProjectSettings/ProjectSettings.asset
          echo "new-version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ProjectSettings/ProjectSettings.asset
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new-version }} [skip ci]"
          git push origin ${{ github.base_ref }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Job 1: Build APK on the local Windows machine (zero cloud minutes) ────────
  build:
    name: Android APK Build
    needs: [bump-version]
    runs-on: [self-hosted, windows, unity]

    outputs:
      version: ${{ steps.version.outputs.value }}
      apk-name: ${{ steps.version.outputs.apk-name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          lfs: true

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "ProjectSettings\ProjectSettings.asset" -Raw
          if ($content -match 'bundleVersion:\s*(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
            Write-Host "Building version: $ver"
            echo "value=$ver" >> $env:GITHUB_OUTPUT
            echo "apk-name=mobile-idle-builder-v$ver.apk" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not parse bundleVersion from ProjectSettings.asset"; exit 1
          }

      - name: Write keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not (Test-Path "secrets")) { New-Item -ItemType Directory "secrets" | Out-Null }
          $bytes = [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [System.IO.File]::WriteAllBytes("secrets\user.keystore", $bytes)

      - name: Build APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          $unity = if ($env:UNITY_PATH) { $env:UNITY_PATH } `
                   else { "C:\Program Files\Unity\Hub\Editor\6000.3.6f1\Editor\Unity.exe" }
          & $unity -batchmode -nographics -quit -projectPath . `
            -executeMethod MobileIdleBuilder.Editor.BuildScript.BuildAndroidApk `
            -logFile build-android.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "--- Last 50 lines of Unity log ---"
            Get-Content build-android.log -Tail 50
            exit $LASTEXITCODE
          }

      - name: Remove keystore
        if: always()
        shell: pwsh
        run: Remove-Item -Force "secrets\user.keystore" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-dev-${{ github.run_number }}
          path: build-android.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: build/Android/*.apk
          retention-days: 30

  # ── Job 2: Distribute APK via Firebase (ubuntu runner, Docker actions work here) ──
  distribute:
    name: Firebase App Distribution
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: dist/

      - name: Find APK
        id: apk
        run: echo "path=$(ls dist/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: internal-testers
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.run_number }}
