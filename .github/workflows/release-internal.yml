name: Release Internal

# Test pipe: a PR merged INTO a release/** branch -> signed .aab on the local
# Windows runner -> Google Play internal testing track.
#
# Tests and the version-code guard are NOT repeated here: they already ran as
# required checks on the PR (pr-tests.yml) before the merge was allowed. This
# workflow only builds and uploads. The Play upload itself is the final backstop
# -- it rejects a duplicate version code at upload time.
# A manual run (Actions > Release Internal > Run workflow, or
# `gh workflow run "Release Internal" --ref release/<x.y>`) builds and uploads the chosen
# release branch. Only users with write access can dispatch.
on:
  pull_request:
    types: [closed]
    branches: ['release/**']
  workflow_dispatch:

# One internal build per release branch; a burst of merges collapses to the
# latest (cancel the in-flight build instead of queueing several Unity builds).
concurrency:
  group: release-internal-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build the AAB on the local Windows machine ───────────────────────────────
  build:
    name: Android AAB Build
    # A manual run must target a release branch: the Play internal track only takes release builds.
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/')) ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, unity]

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Read version
        id: version
        shell: powershell
        run: |
          $content = Get-Content "ProjectSettings\ProjectSettings.asset" -Raw
          if ($content -match 'bundleVersion:\s*(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
            Write-Host "Building version: $ver"
            echo "value=$ver" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not parse bundleVersion from ProjectSettings.asset"; exit 1
          }

      - name: Write keystore
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not (Test-Path "secrets")) { New-Item -ItemType Directory "secrets" | Out-Null }
          $bytes = [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [System.IO.File]::WriteAllBytes("secrets\user.keystore", $bytes)

      # Bring back the warm Library/ from the last build (checkout's git clean deletes it).
      # Turns a 70-100 min cold IL2CPP build into an incremental one. See the script header.
      - name: Restore Library
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\ci-library-stash.ps1 -Action Restore -Name internal

      # NOTE: "shell: powershell" does NOT propagate a nested process's exit code, so
      # build-android.ps1 exiting non-zero is silently ignored unless $LASTEXITCODE is
      # checked here. Without these guards a hard Unity failure (e.g. UnityLinker choking
      # on link.xml) sails through this step and surfaces three steps later as a baffling
      # "Missing an argument for parameter 'AabPath'" from the signer. Fail where it broke.
      - name: Build AAB
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-android.ps1 -ExecuteMethod MobileIdleBuilder.Editor.BuildScript.BuildAndroidDevelopment
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Unity build failed (exit $LASTEXITCODE). See the build-log artifact."
            exit $LASTEXITCODE
          }
          # Belt and braces: Unity can report success and still produce nothing.
          if (-not (Get-ChildItem build\Android\*.aab -ErrorAction SilentlyContinue)) {
            Write-Host "::error::Build reported success but produced no .aab in build\Android."
            exit 1
          }

      - name: Sign AAB
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          $aab = (Get-ChildItem build\Android\*.aab | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File .\scripts\sign-aab.ps1 -AabPath $aab
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Signing failed (exit $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      - name: Remove keystore
        if: always()
        shell: powershell
        run: Remove-Item -Force "secrets\user.keystore" -ErrorAction SilentlyContinue

      # always(): even a timed-out build leaves useful compiled output, so the retry resumes.
      - name: Save Library
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\ci-library-stash.ps1 -Action Save -Name internal

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-log-internal-${{ github.run_number }}
          path: build-android.log
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab-${{ github.run_number }}
          path: build/Android/*.aab
          retention-days: 30

      # IL2CPP debug symbols (BuildScript.ConfigureAndroidDebugSymbols) for symbolicating crash reports in
      # Cloud Diagnostics and Play Console. See docs/runbooks/cloud-diagnostics-setup.md.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ github.run_number }}
          path: build/Android/*.symbols.zip
          if-no-files-found: warn
          retention-days: 90

  # ── Cloud Code: the PvE module to the development environment (ubuntu) ───────
  # Ships the server with the client it serves: same trigger and commit as the internal build, so the
  # development environment's PveModule always matches the newest internal APK. Runs beside the Unity build
  # (it doesn't need it), and a failure here never blocks the Play upload. Tests -> dotnet publish -> .ccm ->
  # `ugs deploy`; see scripts/deploy-cloud-code.sh and docs/runbooks/pve-backend-setup.md ("CI deploy").
  # The service account needs the "Cloud Code Editor" project role.
  cloud-code:
    name: Cloud Code Deploy (development)
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/')) ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      UGS_CLI_SERVICE_KEY_ID: ${{ secrets.UGS_GAME_CONFIG_SERVICE_KEY_ID }}
      UGS_CLI_SERVICE_SECRET_KEY: ${{ secrets.UGS_GAME_CONFIG_SERVICE_SECRET_KEY }}
      UGS_PROJECT_ID: ${{ secrets.UGS_PROJECT_ID }}
      UGS_ENV_ID_DEVELOPMENT: ${{ secrets.UGS_ENV_ID_DEVELOPMENT }}
      UGS_CLI_VERSION: 2.1.0
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install UGS CLI
        run: npm install -g "ugs@${UGS_CLI_VERSION}"

      - name: Test, build and deploy PveModule
        env:
          CCM_OUT_DIR: ${{ runner.temp }}/cloud-code
        run: |
          chmod +x scripts/deploy-cloud-code.sh
          ./scripts/deploy-cloud-code.sh "$UGS_ENV_ID_DEVELOPMENT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pve-module-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/cloud-code/PveModule.ccm
            ${{ runner.temp }}/cloud-code/deploy-result.json
          retention-days: 30
          if-no-files-found: ignore

  # ── Job 3: Upload to Google Play internal track (ubuntu, Docker action) ──────
  upload:
    name: Google Play Internal
    needs: build
    runs-on: ubuntu-latest
    env:
      UGS_SERVICE_KEY_ID: ${{ secrets.UGS_GAME_CONFIG_SERVICE_KEY_ID }}
      UGS_SERVICE_SECRET: ${{ secrets.UGS_GAME_CONFIG_SERVICE_SECRET_KEY }}
      UGS_PROJECT_ID: ${{ secrets.UGS_PROJECT_ID }}
      UGS_ENV_ID_DEVELOPMENT: ${{ secrets.UGS_ENV_ID_DEVELOPMENT }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-aab-${{ github.run_number }}
          path: dist/

      - name: Find AAB
        id: aab
        run: echo "path=$(ls dist/*.aab | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: com.clemtek.mobileidlebuilder
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
          status: completed

      # In-game update prompt: tell older internal builds that this version is out
      # (Remote Config update.latest.android in the development environment, read by
      # AppUpdateCheck on the splash). Skipped until the UGS secrets exist; a Remote
      # Config failure never fails the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.UGS_SERVICE_KEY_ID != ''
        with:
          sparse-checkout: |
            scripts
            docs

      - name: Publish latest Android version for the update prompt
        if: env.UGS_SERVICE_KEY_ID != ''
        continue-on-error: true
        shell: pwsh
        run: ./scripts/set-remote-config.ps1 -EnvironmentId "$env:UGS_ENV_ID_DEVELOPMENT" -Key update.latest.android -Value "${{ needs.build.outputs.version }}"

      # What's-new notice (#502): docs/whats-new.md -> whatsnew.notes + whatsnew.version in one write, so the
      # game shows this release's notes once on this build or newer (WhatsNew.cs). Blank notes skip the write.
      - name: Publish what's-new notes
        if: env.UGS_SERVICE_KEY_ID != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'whatsnew.json'
          python3 scripts/whats_new.py "${{ needs.build.outputs.version }}" $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path $out) { ./scripts/set-remote-config.ps1 -EnvironmentId "$env:UGS_ENV_ID_DEVELOPMENT" -JsonFile $out }
