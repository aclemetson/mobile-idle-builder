name: Prod Release

# Future production pipe (parked). Internal testing is fed by release-internal.yml.
# This ships to the Google Play *production* track as a draft, and is manual-only
# so nothing reaches production until we deliberately trigger it.
on:
  workflow_dispatch:

# Only one production release at a time
concurrency:
  group: prod-release
  cancel-in-progress: false

permissions:
  contents: write   # needed to create tags and GitHub Releases

jobs:
  # ── Job 1: Build AAB on the local Windows machine ────────────────────────────
  build:
    name: Android AAB Build
    runs-on: [self-hosted, windows, unity]

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0   # needed for git tag push later

      - name: Read version
        id: version
        shell: powershell
        run: |
          $content = Get-Content "ProjectSettings\ProjectSettings.asset" -Raw
          if ($content -match 'bundleVersion:\s*(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
            Write-Host "Releasing version: $ver"
            echo "value=$ver" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not parse bundleVersion from ProjectSettings.asset"; exit 1
          }

      - name: Write keystore
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not (Test-Path "secrets")) { New-Item -ItemType Directory "secrets" | Out-Null }
          $bytes = [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [System.IO.File]::WriteAllBytes("secrets\user.keystore", $bytes)

      - name: Build AAB
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-android.ps1

      - name: Sign AAB
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          $aab = (Get-ChildItem build\Android\*.aab | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File .\scripts\sign-aab.ps1 -AabPath $aab

      - name: Remove keystore
        if: always()
        shell: powershell
        run: Remove-Item -Force "secrets\user.keystore" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-prod-${{ github.run_number }}
          path: build-android.log
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
          path: build/Android/*.aab
          retention-days: 90

  # ── Job 2: Release — tag, Play Store, GitHub Release (ubuntu, Docker OK) ─────
  release:
    name: Tag + Play Store + GitHub Release
    needs: build
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
          path: dist/

      - name: Find AAB
        id: aab
        run: echo "path=$(ls dist/*.aab | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Upload to Google Play Production (draft)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: com.clemtek.mobileidlebuilder
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: production
          status: draft

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "${{ steps.aab.outputs.path }}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest

