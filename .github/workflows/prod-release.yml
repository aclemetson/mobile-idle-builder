name: Prod Release

# Future production pipe (parked). Internal testing is fed by release-internal.yml.
# This ships to the Google Play *production* track as a draft, and is manual-only
# so nothing reaches production until we deliberately trigger it.
on:
  workflow_dispatch:

# Only one production release at a time
concurrency:
  group: prod-release
  cancel-in-progress: false

permissions:
  contents: write   # needed to create tags and GitHub Releases

jobs:
  # ── Job 1: Build AAB on the local Windows machine ────────────────────────────
  build:
    name: Android AAB Build
    runs-on: [self-hosted, windows, unity]

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0   # needed for git tag push later

      - name: Read version
        id: version
        shell: powershell
        run: |
          $content = Get-Content "ProjectSettings\ProjectSettings.asset" -Raw
          if ($content -match 'bundleVersion:\s*(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
            Write-Host "Releasing version: $ver"
            echo "value=$ver" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not parse bundleVersion from ProjectSettings.asset"; exit 1
          }

      - name: Write keystore
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not (Test-Path "secrets")) { New-Item -ItemType Directory "secrets" | Out-Null }
          $bytes = [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [System.IO.File]::WriteAllBytes("secrets\user.keystore", $bytes)

      # Warm Library/ survives between builds this way (see scripts/ci-library-stash.ps1).
      # Separate stash from release-internal: different scripting defines.
      - name: Restore Library
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\ci-library-stash.ps1 -Action Restore -Name prod

      - name: Build AAB
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-android.ps1

      - name: Sign AAB
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          $aab = (Get-ChildItem build\Android\*.aab | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File .\scripts\sign-aab.ps1 -AabPath $aab

      - name: Remove keystore
        if: always()
        shell: powershell
        run: Remove-Item -Force "secrets\user.keystore" -ErrorAction SilentlyContinue

      # IL2CPP symbols to Unity Diagnostics for readable crash reports. Reads Library/, so it must run
      # before Save Library. Never blocks the release; see docs/runbooks/cloud-diagnostics-setup.md.
      - name: Upload symbols to Unity Diagnostics
        continue-on-error: true
        shell: powershell
        env:
          UGS_SERVICE_KEY_ID: ${{ secrets.UGS_SYMBOLS_SERVICE_KEY_ID }}
          UGS_SERVICE_SECRET: ${{ secrets.UGS_SYMBOLS_SERVICE_KEY_SECRET }}
          UGS_PROJECT_ID: ${{ secrets.UGS_PROJECT_ID }}
        run: powershell -ExecutionPolicy Bypass -File .\scripts\ci\upload-symbols.ps1

      - name: Save Library
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\ci-library-stash.ps1 -Action Save -Name prod

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-log-prod-${{ github.run_number }}
          path: build-android.log
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab-${{ github.run_number }}
          path: build/Android/*.aab
          retention-days: 90

      # IL2CPP debug symbols for crash symbolication; see docs/runbooks/cloud-diagnostics-setup.md.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ github.run_number }}
          path: build/Android/*.symbols.zip
          if-no-files-found: warn
          retention-days: 90

  # ── Job 2: Release — tag, Play Store, GitHub Release (ubuntu, Docker OK) ─────
  release:
    name: Tag + Play Store + GitHub Release
    needs: build
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-aab-${{ github.run_number }}
          path: dist/

      - name: Find AAB
        id: aab
        run: echo "path=$(ls dist/*.aab | head -1)" >> "$GITHUB_OUTPUT"

      # Native debug symbols for Play's crash/ANR view. Optional: missing or over Play's 800 MB limit
      # uploads the AAB without them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: android-symbols-${{ github.run_number }}
          path: symbols/

      - name: Find symbols
        id: sym
        run: |
          f=$(ls symbols/*.symbols.zip 2>/dev/null | head -1)
          if [ -n "$f" ] && [ "$(stat -c %s "$f")" -lt 790000000 ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
            echo "Uploading debug symbols: $f ($(du -h "$f" | cut -f1))"
          else
            echo "::warning::No debug symbols uploaded (missing or over 790 MB): ${f:-none}"
          fi

      - name: Create and push git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Upload to Google Play Production (draft)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: com.clemtek.mobileidlebuilder
          releaseFiles: ${{ steps.aab.outputs.path }}
          debugSymbols: ${{ steps.sym.outputs.path }}
          track: production
          status: draft

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "${{ steps.aab.outputs.path }}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest

  # -- Staff alert on Discord when any job above fails (#533). Skips while DISCORD_STAFF_WEBHOOK is unset. --
  discord-alert:
    name: Discord failure alert
    needs: [build, release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            docs
          persist-credentials: false
      - name: Post alert
        env:
          DISCORD_STAFF_WEBHOOK: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/discord/notify.py alert --webhook-env DISCORD_STAFF_WEBHOOK --text "Prod Release failed on ${{ github.ref_name }}" --url "$RUN_URL"

