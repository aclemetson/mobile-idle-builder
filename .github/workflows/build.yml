name: Build

on:
  push:
    branches: [main, develop, "release/*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PATH: "C:/Program Files/Unity/Hub/Editor/6000.3.6f1/Editor/Unity.exe"

jobs:
  test:
    name: Run Edit-Mode Tests
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Edit-Mode Tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          & $env:UNITY_PATH `
            -runTests `
            -testPlatform editmode `
            -testResults test-results/results.xml `
            -batchmode `
            -projectPath . `
            -logFile test-results/unity.log
          $exitCode = $LASTEXITCODE
          Get-Content test-results/unity.log -ErrorAction SilentlyContinue
          exit $exitCode

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-build
          path: test-results
          retention-days: 7

  build-android:
    name: Build Android
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Decode Keystore
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}/secrets/user.keystore", $bytes)

      - name: Build Android (.aab)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/Android | Out-Null
          & $env:UNITY_PATH `
            -batchmode `
            -quit `
            -projectPath . `
            -buildTarget Android `
            -logFile build/unity-build.log `
            -executeMethod BuildScript.BuildAndroid
          $exitCode = $LASTEXITCODE
          Get-Content build/unity-build.log -ErrorAction SilentlyContinue
          exit $exitCode

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: build/Android
          retention-days: 14

      - name: Deploy to Firebase (Android)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: internal-testers
          file: build/Android/*.aab

      - name: Cleanup Keystore
        if: always()
        shell: pwsh
        run: Remove-Item -Force "${{ github.workspace }}/secrets/user.keystore" -ErrorAction SilentlyContinue
