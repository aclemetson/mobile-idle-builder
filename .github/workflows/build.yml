name: Build

# CI disabled temporarily — re-enable when GitHub Actions issues are resolved
# on:
#   push:
#     branches: [main, develop, "release/*"]
on: workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PATH: "C:/Program Files/Unity/Hub/Editor/6000.3.6f1/Editor/Unity.exe"

jobs:
  test-and-build-android:
    name: Test and Build Android
    if: false  # CI disabled — remove this line to re-enable
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Edit-Mode Tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          & $env:UNITY_PATH `
            -runTests `
            -testPlatform editmode `
            -testResults test-results/results.xml `
            -batchmode `
            -projectPath . `
            -logFile test-results/unity.log
          $exitCode = $LASTEXITCODE
          Get-Content test-results/unity.log -ErrorAction SilentlyContinue
          exit $exitCode

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-build
          path: test-results
          retention-days: 7

      - name: Decode Keystore
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/secrets" | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}/secrets/user.keystore", $bytes)

      - name: Build Android (.aab)
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          New-Item -ItemType Directory -Force -Path build/Android | Out-Null
          New-Item -ItemType Directory -Force -Path Logs | Out-Null
          & $env:UNITY_PATH `
            -batchmode `
            -quit `
            -projectPath . `
            -logFile Logs/build.log `
            -executeMethod MobileIdleBuilder.Editor.BuildScript.BuildAndroid
          $exitCode = $LASTEXITCODE
          Write-Host "=== Unity Build Log ==="
          Get-Content Logs/build.log -ErrorAction SilentlyContinue
          exit $exitCode

      - name: Upload Unity Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-build-log
          path: Logs/build.log
          retention-days: 3

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: build/Android
          retention-days: 14

      - name: Deploy to Firebase (Android)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        shell: powershell
        env:
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
        run: |
          $credPath = "${{ github.workspace }}/secrets/firebase-credentials.json"
          Set-Content -Path $credPath -Value $env:GOOGLE_APPLICATION_CREDENTIALS_CONTENT
          $env:GOOGLE_APPLICATION_CREDENTIALS = $credPath
          $aab = Get-ChildItem "build/Android/*.aab" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $aab) { Write-Error "No .aab file found in build/Android/"; exit 1 }
          firebase appdistribution:distribute $aab.FullName `
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" `
            --groups "internal-testers"
          Remove-Item -Force $credPath -ErrorAction SilentlyContinue

      - name: Cleanup Keystore
        if: always()
        shell: powershell
        run: Remove-Item -Force "${{ github.workspace }}/secrets/user.keystore" -ErrorAction SilentlyContinue
