name: Release iOS

# iOS / TestFlight lane.
#
# Trigger: a push to develop, which happens when a release/** branch is merged
# down. That is far less often than the Android per-release-merge lane, by design
# -- iOS builds once per release cycle. The bump-version bot commit on develop
# carries [skip ci], so it does not re-trigger this workflow.
#
# Split, following GameCI's recommended iOS flow:
#   1. build   (ubuntu) - game-ci/unity-builder generates the Xcode project. Unity
#                         activation works here via Docker (Personal license).
#   2. release (macos)  - xcodebuild archive + export + TestFlight upload. Only the
#                         Xcode steps need macOS, keeping the 10x-billed mac job small.
#
# Tests are NOT re-run: pr-tests.yml already gated the PRs into the release branch
# and into develop. TestFlight rejecting a duplicate build number is the backstop,
# mirroring the Google Play upload on the Android side.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- Compile the Unity iOS Xcode project on Linux (cheap, Docker activation) ----
  build:
    name: Unity iOS Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Hosted Ubuntu runners ship with only ~14 GB free, which is not enough to
      # pull the multi-GB Unity iOS editor image alongside the LFS checkout and
      # the Library cache -- the docker pull intermittently fails with "no space
      # left on device". Reclaim ~25 GB by deleting large preinstalled toolchains
      # this job never uses (Android SDK, .NET, GHC/Haskell, CodeQL) plus any
      # preloaded docker images.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"; df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Build Unity iOS Xcode project
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # unity-builder v6 looks up game-ci/cli releases on the GitHub API; unauthenticated
          # calls from shared runners hit the rate limit (403) and fail the job in seconds.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          unityVersion: 6000.3.6f1
          # Pinned so builds are reproducible and "latest" needs no API lookup. Bump on purpose.
          cliVersion: v0.1.76
          targetPlatform: iOS
          # TestFlight is the iOS testing lane: build with the dev console, like the Android internal track.
          buildMethod: MobileIdleBuilder.Editor.BuildScript.BuildIOSDevelopment

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcode-project
          path: build/iOS
          retention-days: 3
          include-hidden-files: true

  # -- Archive, sign (ASC API key, automatic), and upload to TestFlight ----------
  release:
    name: Archive and Upload to TestFlight
    needs: build
    runs-on: macos-latest
    env:
      UGS_SERVICE_KEY_ID: ${{ secrets.UGS_PROJECT_SERVICE_KEY_ID }}
      UGS_SERVICE_SECRET: ${{ secrets.UGS_PROJECT_SERVICE_KEY_SECRET }}
      UGS_PROJECT_ID: ${{ secrets.UGS_PROJECT_ID }}
      UGS_ENV_ID_DEVELOPMENT: ${{ secrets.UGS_ENV_ID_DEVELOPMENT }}
    # 90 (not 60): the Unity + 9-pod CocoaPods workspace archive can take ~50 min
    # on some Xcode versions, leaving little headroom at 60.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcode-project
          path: build/iOS

      # Pin Xcode for reproducible build times. `latest-stable` drifted the
      # runner to Xcode 26.5, which made the archive ~3x slower (~50 min) and
      # nearly hit the timeout. 26.3 is the known-good, fast version that
      # archived this project in ~17 min. Bump deliberately, not implicitly.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'

      - name: Archive, sign, and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Fixed Apple Development identity for the archive step, so runs stop creating certificates.
          IOS_SIGNING_CERT_P12_BASE64: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          chmod +x scripts/archive-upload-ios.sh
          scripts/archive-upload-ios.sh

      # In-game update prompt: tell older TestFlight builds that this version is out
      # (Remote Config update.latest.ios in the development environment). TestFlight
      # processing takes 10-30 min, so the prompt can arrive a little before the build
      # is installable. Skipped until the UGS secrets exist; never fails the release.
      - name: Publish latest iOS version for the update prompt
        if: env.UGS_SERVICE_KEY_ID != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $content = Get-Content "ProjectSettings/ProjectSettings.asset" -Raw
          if ($content -notmatch 'bundleVersion:\s*(\d+\.\d+\.\d+)') { Write-Error "No bundleVersion"; exit 1 }
          ./scripts/set-remote-config.ps1 -EnvironmentId "$env:UGS_ENV_ID_DEVELOPMENT" -Key update.latest.ios -Value $Matches[1]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-archive-log-${{ github.run_number }}
          path: archive-ios.log
          retention-days: 14
          if-no-files-found: ignore

  # -- Staff alert on Discord when any job above fails (#533). Skips while DISCORD_STAFF_WEBHOOK is unset. --
  discord-alert:
    name: Discord failure alert
    needs: [build, release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            docs
          persist-credentials: false
      - name: Post alert
        env:
          DISCORD_STAFF_WEBHOOK: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/discord/notify.py alert --webhook-env DISCORD_STAFF_WEBHOOK --text "Release iOS failed on ${{ github.ref_name }}" --url "$RUN_URL"
